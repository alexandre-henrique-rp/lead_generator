# Scripts de build permitidos (pnpm 10.26+/12 usa allowBuilds).
# Os demais pacotes com scripts ficam explicitamente bloqueados.
allowBuilds:
  "@prisma/engines": true
  better-sqlite3: true
  esbuild: true
  lightningcss: true
  prisma: true
  "@tanstack/devtools-vite": false
  "@tanstack/match-sorter-utils": false
  "@tanstack/react-start": false
  "@tanstack/react-table": false
