# ==========================================================================
# docker-compose.yml — lead_generator (uso local / teste de container)
# NÃO é necessário no Coolify (que gerencia containers diretamente).
# Use este arquivo para testar o container localmente antes do deploy.
# ==========================================================================

services:
  sisten:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"

      # ── Localização do banco SQLite ──────────────────────────────────
      # Formato obrigatório: file:<caminho-absoluto>
      # O /data é o volume persistente — NÃO use caminhos relativos aqui
      DATABASE_URL: "file:/data/prod.db"
      DB_DATA_DIR: "/data"

      # ── Credenciais do admin ─────────────────────────────────────────
      ADMIN_EMAIL: admin@kingdevtec.com
      ADMIN_SENHA: troque-em-producao
      ADMIN_NOME: "Administrador KingDevTec"

      # ── Outras configs ───────────────────────────────────────────────
      CNPJ_API_URL: https://brasilapi.com.br/api/cnpj/v1
      SERVER_URL: http://localhost:3000

      # Adicione suas chaves de API aqui para teste local:
      # AISA_API_KEY: sk-aisa-...
      # GEMINI_API_KEY: ...

    volumes:
      # Volume nomeado → persiste o prod.db entre restarts e rebuilds
      # Coolify cria este volume automaticamente quando você configura
      # Storage Path: /data no painel da aplicação
      - sisten_data:/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  # Volume nomeado — o Docker garante persistência mesmo após `down`
  # Para inspecionar: docker volume inspect lead_generator_sisten_data
  # Para backup:      docker run --rm -v lead_generator_sisten_data:/data -v $(pwd):/bkp alpine tar czf /bkp/prod.db.tar.gz -C /data .
  sisten_data:
    driver: local
