# ==========================================================================
# docker-compose.yml — Sisten / KingDevTec
# --------------------------------------------------------------------------
# Coolify lê este arquivo e:
#   • Expõe no painel todas as variáveis com sintaxe ${VAR:-default}
#   • Cria e gerencia automaticamente o volume nomeado "sisten_data"
#
# Para testar localmente: docker compose up --build
# ==========================================================================

services:
  sisten:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      # HOST_PORT = porta PUBLICADA no servidor (ex.: 3005).
      # O container SEMPRE escuta em 3000 (ver APP_PORT abaixo).
      # Regra: a variável da porta do host NUNCA pode ser a mesma da porta
      # interna. Se as duas valerem 3005, o mapeamento vira host:3005 ->
      # container:3000 e o app (que escuta em 3005) fica inacessível:
      # o proxy/Cloudflare recebe "connection refused" e devolve 502.
      - "${HOST_PORT:-3000}:3000"

    environment:
      # ── Runtime ───────────────────────────────────────────────────────
      NODE_ENV: ${NODE_ENV:-production}
      # Porta INTERNA do app (dentro do container). Fixa em 3000.
      # O entrypoint faz `export PORT=$APP_PORT`, então o Nitro escuta aqui
      # independentemente de qualquer PORT injetado pelo painel do Coolify.
      APP_PORT: "3000"

      # ── Banco SQLite — volume persistente em /data ────────────────────
      # IMPORTANTE: use sempre caminho absoluto (file:/data/...).
      # O diretório /data é o ponto de montagem do volume abaixo.
      DATABASE_URL: ${DATABASE_URL:-file:/data/prod.db}
      DB_DATA_DIR: ${DB_DATA_DIR:-/data}

      # ── Admin — TROQUE ADMIN_SENHA antes do 1º deploy! ───────────────
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@kingdevtec.com}
      ADMIN_SENHA: ${ADMIN_SENHA:-troque-em-producao}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador KingDevTec}

      # ── URL pública ───────────────────────────────────────────────────
      SERVER_URL: ${SERVER_URL:-https://kingdevtec.com}
      VITE_APP_TITLE: ${VITE_APP_TITLE:-KingDevTec — Sisten}

      # ── API de CNPJ (pública, sem chave) ─────────────────────────────
      CNPJ_API_URL: ${CNPJ_API_URL:-https://brasilapi.com.br/api/cnpj/v1}

    volumes:
      # Volume nomeado → Coolify cria e gerencia automaticamente
      # Ponto de montagem: /data (onde fica o prod.db)
      - sisten_data:/data

    restart: unless-stopped

    healthcheck:
      # CMD-SHELL resolve APP_PORT de dentro do container → o probe sempre
      # acerta a porta real do app (sem depender de interpolação do Compose).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${APP_PORT:-3000}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

# Coolify detecta e persiste volumes nomeados automaticamente.
# Backup local: docker run --rm \
#   -v lead_generator_sisten_data:/data \
#   -v $(pwd):/bkp alpine \
#   tar czf /bkp/prod.db.tar.gz -C /data .
volumes:
  sisten_data:
    driver: local
